<head>

<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Poppins,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;touch-action:none;user-select:none}
.wrap{position:relative;width:min(100%,900px);aspect-ratio:5/3;border-radius:10px;overflow:hidden;background:#0c1a12}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:linear-gradient(160deg,rgba(56,0,60,.93),rgba(30,0,40,.9));color:#fff;padding:10px;text-align:center;overflow:auto}
.ov.hide{display:none}
.ov h1{font-family:"Black Han Sans",Poppins,sans-serif;font-weight:400;font-size:clamp(26px,6vw,46px);margin:0;border-bottom:4px solid #04f5ff;padding:0 10px 2px}
.ov p{margin:0;font-size:12px;opacity:.85;line-height:1.5}
.ov h3{margin:2px 0 0;font-size:12px;font-weight:600;color:#04f5ff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.chip i{width:16px;height:16px;border-radius:4px;border:2px solid #fff}
.chip.on{background:#04f5ff;color:#37003c;border-color:#04f5ff}
.sq{font-size:11px;opacity:.9}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #00ff85;outline-offset:2px}
.go{background:#e90052;color:#fff;border:0;border-radius:8px;padding:10px 32px;font-size:17px;font-weight:800;margin-top:4px}
.bar{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(100%,900px);color:var(--mute);font-size:12px}
.btns{display:flex;gap:10px}
.act{color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:800}
.act:active{transform:scale(.96)}
#bS{background:#0b6bff}#bA{background:#963cff}#shoot{background:#e90052}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="sb"><span class="sw" id="w1"></span><span id="a1">MCI</span><span class="sc" id="s1">0</span><span class="sc" id="s2">0</span><span id="a2">ARS</span><span class="sw" id="w2"></span><span class="tm" id="time">00:00</span><span class="hf" id="half">전반</span></div>

  <div id="msg"></div>
  <div id="jb"><div id="jk"></div></div>

    <button class="go" id="start">경기 시작</button>
  </div>
</div>
<div class="bar"><span id="hint">초록 화살표가 내 선수 · 오른쪽 골대 공격</span><div class="btns"><button class="act" id="bA">로빙(A)</button><button class="act" id="bS">패스(S)</button><button class="act" id="shoot">슛</button></div></div>
<script>
const W=800,H=480,GY0=185,GY1=295,$=id=>document.getElementById(id),wrap=$('wrap');
const TEAMS=[
{s:'맨체스터 시티',ab:'MCI',h:{sh:'#6CABDD',sl:'#6CABDD',st:'#ffffff',so:'#6CABDD'},a:{sh:'#1c2c5b',sl:'#1c2c5b',st:'#1c2c5b',so:'#1c2c5b'},sq:['P. Foden','E. Haaland','N. O\'Reilly','G. Donnarumma'],nu:[47,9,33,1]},
{s:'아스널',ab:'ARS',h:{sh:'#EF0107',sl:'#f5f5f5',st:'#f5f5f5',so:'#EF0107'},a:{sh:'#f2d21b',sl:'#f2d21b',st:'#1a2a5a',so:'#f2d21b'},sq:['B. Saka','V. Gyökeres','W. Saliba','D. Raya'],nu:[7,14,2,1]},

{s:'첼시',ab:'CHE',h:{sh:'#034694',sl:'#034694',st:'#034694',so:'#f5f5f5'},a:{sh:'#f5f5f5',sl:'#f5f5f5',st:'#1a1a4a',so:'#f5f5f5'},sq:['C. Palmer','João Pedro','L. Colwill','R. Sánchez'],nu:[10,9,6,1]},
{s:'토트넘',ab:'TOT',h:{sh:'#f5f5f5',sl:'#f5f5f5',st:'#132257',so:'#f5f5f5'},a:{sh:'#132257',sl:'#132257',st:'#132257',so:'#132257'},sq:['X. Simons','M. Tel','M. van de Ven','A. Kinský'],nu:[7,11,37,1]},
{s:'뉴캐슬',ab:'NEW',h:{sh:'#1a1a1a',pt:'#f5f5f5',sl:'#1a1a1a',st:'#1a1a1a',so:'#1a1a1a'},a:{sh:'#e8e8e8',sl:'#e8e8e8',st:'#e8e8e8',so:'#e8e8e8'},sq:['H. Barnes','Y. Wissa','S. Botman','N. Pope'],nu:[11,9,4,1]}];
const GK=['#7b2fbf','#2fbf4a'];
let sel=[0,1],T=null,kit,models=[],ball,sc=[0,0],left=45,half=1,state='menu',pause=0,msg='',keys={},joy=null,shootHeld=false,tackleReq=false,passReq=false,switchReq=false,sReq=false,aReq=false,flip=false,chg=null,lastAtk=null,goalBall=false,last=0,me;

// ---------- three.js ----------
const rd=new THREE.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(2,devicePixelRatio));wrap.insertBefore(rd.domElement,wrap.firstChild);

function cyl(rt,rb,h,m,x,y,z){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,10),m);o.position.set(x,y,z);return o}
(function pitch(){const c=document.createElement('canvas');c.width=1600;c.height=960;const x=c.getContext('2d');x.scale(2,2);
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#2f8f4e':'#2a8447';x.fillRect(i*100,0,100,H)}
  x.strokeStyle='#f4f7f0';x.lineWidth=2.5;x.strokeRect(2,2,W-4,H-4);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.beginPath();x.arc(W/2,H/2,60,0,7);x.stroke();x.strokeRect(2,130,110,220);x.strokeRect(W-112,130,110,220);x.strokeRect(2,GY0-20,40,GY1-GY0+40);x.strokeRect(W-42,GY0-20,40,GY1-GY0+40);[[0,0,0],[W,0,1],[0,H,3],[W,H,2]].forEach(([cx,cy,k])=>{x.beginPath();x.arc(cx,cy,12,k*Math.PI/2,(k+1)*Math.PI/2);x.stroke()});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(c)}));p.rotation.x=-Math.PI/2;p.position.set(W/2,0,H/2);scene.add(p);
  const o=new THREE.Mesh(new THREE.PlaneGeometry(1600,1100),mat('#1d5a33'));o.rotation.x=-Math.PI/2;o.position.set(W/2,-.5,H/2);scene.add(o);
  const ac=document.createElement('canvas');ac.width=512;ac.height=32;{const x=ac.getContext('2d');x.fillStyle='#37003c';x.fillRect(0,0,512,32);x.font='800 18px Poppins,sans-serif';x.textBaseline='middle';x.fillStyle='#fff';x.fillText('PREMIER LEAGUE',12,17);x.fillStyle='#04f5ff';x.fillText('2026/27',230,17);x.fillStyle='#e90052';x.fillRect(340,6,40,20);x.fillStyle='#00ff85';x.fillRect(390,6,40,20);x.fillStyle='#963cff';x.fillRect(440,6,40,20)}
  const at=new THREE.CanvasTexture(ac);at.wrapS=THREE.RepeatWrapping;at.repeat.set(3,1);const bm=new THREE.MeshLambertMaterial({map:at});[[W/2,-18],[W/2,H+18]].forEach(([x,z])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(W+60,12,3),bm);b.position.set(x,6,z);scene.add(b)})})();
const skin=['#e0ac8a','#8d5a3b','#f1c9a5'];

  x.globalAlpha=.6;for(let i=0;i<85;i++)for(let j=0;j<21;j++){x.fillStyle=cols[Math.random()*cols.length|0];x.fillRect(i*6+1,j*6+2,4,3)}x.globalAlpha=1

const cm=[0,1,2].map(()=>new THREE.MeshLambertMaterial({color:'#fff'}));
function setCrowd(){const f=t=>{const k=TEAMS[sel[t]].h;return k.pt?[k.sh,k.pt,k.sh,k.pt]:[k.sh,k.sh,k.sh,k.sl,k.st]};
  cm[0].map=crowd(f(0));cm[1].map=crowd(f(1));cm[2].map=crowd(f(0).concat(f(1),['#dddddd','#555555']));cm.forEach(m=>m.needsUpdate=true)}
(function stands(){
  function side(cx,cz,L,nx,nz,m){for(let i=0;i<9;i++){const d=34+i*15,h=10*(i+1),g=new THREE.Mesh(new THREE.BoxGeometry(nx?15:L,h,nx?L:15),m);g.position.set(cx+nx*d,h/2,cz+nz*d);scene.add(g)}
    const r=new THREE.Mesh(new THREE.BoxGeometry(nx?4:L,5,nx?L:4),mat('#f5f5f5'));r.position.set(cx+nx*(34+8*15),92,cz+nz*(34+8*15));scene.add(r)}
  side(W/2,0,W+340,0,-1,cm[2]);side(W/2,H,W+340,0,1,cm[2]);side(0,H/2,H,-1,0,cm[0]);side(W,H/2,H,1,0,cm[1]);
  [[-150,-150],[W+150,-150],[-150,H+150],[W+150,H+150]].forEach(([x,z])=>{scene.add(cyl(3,4,200,mat('#888'),x,100,z));const l=new THREE.Mesh(new THREE.BoxGeometry(40,14,6),new THREE.MeshBasicMaterial({color:'#fffbe0'}));l.position.set(x,205,z);l.lookAt(W/2,0,H/2);scene.add(l)})})();
const nets=[];function goal(x,dir){const m=mat('#f4f4f4'),zm=(GY0+GY1)/2;[GY0,GY1].forEach(z=>scene.add(cyl(2.5,2.5,56,m,x,28,z)));const b=cyl(2.5,2.5,GY1-GY0,m,x,56,zm);b.rotation.x=Math.PI/2;scene.add(b);
  const nc=document.createElement('canvas');nc.width=nc.height=32;const nx=nc.getContext('2d');nx.strokeStyle='#fff';nx.lineWidth=2;nx.strokeRect(0,0,32,32);const nt=new THREE.CanvasTexture(nc);nt.wrapS=nt.wrapT=THREE.RepeatWrapping;nt.repeat.set(12,6);
  const n=new THREE.Mesh(new THREE.PlaneGeometry(GY1-GY0,56,16,10),new THREE.MeshBasicMaterial({map:nt,transparent:true,opacity:.7,side:2,depthWrite:false}));n.rotation.y=Math.PI/2;n.position.set(x+dir*26,28,zm);scene.add(n);
  const ps=n.geometry.attributes.position,bx=[],by=[];for(let i=0;i<ps.count;i++){bx.push(ps.getX(i));by.push(ps.getY(i))}nets[dir<0?0:1]={m:n,dir,bx,by,hit:null}}
goal(0,-1);goal(W,1);
const flags=[];[[0,0],[W,0],[0,H],[W,H]].forEach(([x,z])=>{scene.add(cyl(1,1,44,mat('#ffffff'),x,22,z));const g=new THREE.PlaneGeometry(16,10,8,1);g.translate(8,0,0);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:'#e90052',side:2}));m.position.set(x,38,z);scene.add(m);const p=g.attributes.position,bx=[];for(let i=0;i<p.count;i++)bx.push(p.getX(i));flags.push({p,bx})});
const bc=document.createElement('canvas');bc.width=256;bc.height=128;{const x=bc.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,256,128);const cols=['#e90052','#04f5ff','#2b6cff','#37003c'];
  for(let i=0;i<8;i++){const cx=i*32+16,cy=i%2?40:88;x.fillStyle=cols[i%4];x.beginPath();x.moveTo(cx-18,cy-26);x.lineTo(cx+6,cy-8);x.lineTo(cx+20,cy+24);x.lineTo(cx-4,cy+6);x.closePath();x.fill()}
  x.fillStyle='#37003c';x.font='bold 9px sans-serif';x.fillText('2026/27',104,66)}
const bm=new THREE.Mesh(new THREE.SphereGeometry(6,16,12),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(bc)}));scene.add(bm);const bs=new THREE.Mesh(new THREE.CircleGeometry(5,14),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));bs.rotation.x=-Math.PI/2;scene.add(bs);
const mk=new THREE.Mesh(new THREE.ConeGeometry(5,10,4),new THREE.MeshBasicMaterial({color:'#00ff85'}));mk.rotation.x=Math.PI;scene.add(mk);const rg=new THREE.Mesh(new THREE.RingGeometry(15,18,24),new THREE.MeshBasicMaterial({color:'#00ff85',side:2}));rg.rotation.x=-Math.PI/2;scene.add(rg);
function shirtTex(k){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle=k.sh;x.fillRect(0,0,64,64);if(k.pt){x.fillStyle=k.pt;for(let i=0;i<64;i+=16)x.fillRect(i,0,8,64)}return new THREE.CanvasTexture(c)}
function tag(name,num,isMe){const c=document.createElement('canvas');c.width=256;c.height=56;const x=c.getContext('2d');x.fillStyle=isMe?'#00ff85':'rgba(56,0,60,.88)';x.fillRect(0,0,256,56);x.fillStyle=isMe?'#38003c':'#fff';x.font='bold 30px Poppins,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(num+'  '+name,128,30);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(50,11,1);s.position.y=64;return s}
function makeModel(k,name,num,isMe,i){
  const G=new THREE.Group(),skin=['#e0ac8a','#8d5a3b','#f1c9a5'][i%3],hair=['#2a1a10','#111','#b58a4a'][i%3];G.rotation.order='YXZ';

// ---------- setup / UI ----------
function setup(){setCrowd();const a=TEAMS[sel[0]],b=TEAMS[sel[1]];kit=[a.h,cd(a.h.sh,b.h.sh)<130?b.a:b.h];

  $('w1').style.background=kcss(kit[0]);$('w2').style.background=kcss(kit[1]);$('a1').textContent=a.ab;$('a2').textContent=b.ab;$('me').textContent='나 · '+a.sq[0];

// ---------- simulation ----------

function mkp(x,y,t,i){return{x,y,vx:0,vy:0,r:14,fx:aDir(t),fy:0,cd:0,tk:0,tcd:0,stun:0,hit:false,t,i,ph:0,m:models[t][i]}}
function setMe(q){me=q;$('me').textContent='나 · '+TEAMS[sel[0]].sq[q.i]}
function switchMe(){const c=T[0].filter(q=>q!==me&&q.i!==3);if(!c.length)return;let b=c[0];c.forEach(q=>{if(Math.hypot(q.x-ball.x,q.y-ball.y)<Math.hypot(b.x-ball.x,b.y-ball.y))b=q});setMe(b)}
function resetPos(){chg=null;const P=[[340,240],[300,130],[190,240],[34,240]];T=[0,1].map(t=>P.map((p,i)=>mkp((t===1)!==flip?W-p[0]:p[0],p[1],t,i)));setMe(T[0][0]);ball={x:W/2,y:H/2,vx:0,vy:0,r:6,z:0,vz:0,owner:null}}
function newGame(){setup();sc=[0,0];left=45;half=1;flip=false;goalBall=false;resetPos();hintUpd();state='play';pause=.8;msg='';upd();$('ov').classList.add('hide')}
function kick(p,dx,dy,pw,lf){const d=Math.hypot(ball.x-p.x,ball.y-p.y);if(d>p.r+ball.r+14||p.cd>0||p.stun>0||ball.z>14)return false;if(ball.owner&&ball.owner!==p)return false;const l=Math.hypot(dx,dy)||1;ball.vx=dx/l*pw;ball.vy=dy/l*pw;ball.vz=lf||0;ball.owner=null;p.cd=.35;return true}
function tackle(p,dx,dy){if(p.tcd>0||p.stun>0||p.tk>0)return;const l=Math.hypot(dx,dy)||1;p.fx=dx/l;p.fy=dy/l;p.tk=.22;p.tcd=1.1;p.hit=false}
function move(p,ax,ay,sp,dt){
  if(p.stun>0){p.stun-=dt;ax=ay=0}
  if(p.tk>0){p.vx=p.fx*6;p.vy=p.fy*6;p.tk-=dt;if(p.tk<=0&&!p.hit)p.stun=.3}
  else{const l=Math.hypot(ax,ay);if(l>0){const k=Math.max(1,l);p.vx+=ax/k*sp*6*dt;p.vy+=ay/k*sp*6*dt;if(l>.2){p.fx=ax/l;p.fy=ay/l}}
    p.vx*=Math.pow(.0009,dt);p.vy*=Math.pow(.0009,dt);const v=Math.hypot(p.vx,p.vy);if(v>sp){p.vx*=sp/v;p.vy*=sp/v}}
  p.x=Math.min(W-p.r,Math.max(p.r,p.x+p.vx*dt*60));p.y=Math.min(H-p.r,Math.max(p.r,p.y+p.vy*dt*60));p.cd-=dt;p.tcd-=dt}
function touch(p){if(p.stun>0||ball.z>14||ball.owner)return;const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),m=p.r+ball.r;if(d<m+3&&p.cd<=0&&ball.z<9&&Math.hypot(ball.vx-p.vx,ball.vy-p.vy)<6.5){ball.owner=p;if(p.t===0&&p.i!==3&&p!==me)setMe(p);return}if(d<m&&d>0){const nx=dx/d,ny=dy/d;ball.x=p.x+nx*m;ball.y=p.y+ny*m;ball.vx+=nx*1.6+p.vx*.5;ball.vy+=ny*1.6+p.vy*.5;const v=Math.hypot(ball.vx,ball.vy);if(v>8){ball.vx*=8/v;ball.vy*=8/v}}}
const pass_pw=d=>Math.min(11,d*.017+1.6);
function segd(o,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((o.x-a.x)*dx+(o.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(a.x+dx*t-o.x,a.y+dy*t-o.y)}
function aiPass(p,dir,press){let best=null,bs=-1e9;T[p.t].forEach(q=>{if(q===p||q.i===3)return;const d=Math.hypot(q.x-p.x,q.y-p.y),fw=(q.x-p.x)*dir;if(d<80||d>400||fw<(press?-120:-20))return;
  if(T[1-p.t].some(o=>segd(o,p,q)<26||Math.hypot(o.x-q.x,o.y-q.y)<34))return;const s=fw-d*.25+(q===me?30:0);if(s>bs){bs=s;best=q}});
  if(!best)return false;const d=Math.hypot(best.x-p.x,best.y-p.y);return kick(p,best.x+best.vx*8-ball.x,best.y+best.vy*8-ball.y,pass_pw(d),.4)}
function gkAI(p,dt,ogx,dir){const dB=Math.hypot(ball.x-p.x,ball.y-p.y),inb=Math.abs(ball.x-ogx)<110&&Math.abs(ball.y-H/2)<130;
  let tx=ogx+dir*28,ty=H/2+(ball.y-H/2)*.45;if(inb){tx=ball.x;ty=ball.y}
  ty=Math.min(GY1-8,Math.max(GY0+8,ty));const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/20);move(p,dx/d*s,dy/d*s,3.0,dt);
  const bl=Math.hypot(ball.x-p.x,ball.y-p.y)||1;p.fx=(ball.x-p.x)/bl;p.fy=(ball.y-p.y)/bl;
  if(dB<p.r+ball.r+10){const q=T[p.t].filter(o=>o.i!==3);const t=q[Math.random()*q.length|0];kick(p,t.x-ball.x,t.y-ball.y+(Math.random()-.5)*40,pass_pw(Math.hypot(t.x-p.x,t.y-p.y)),2)}}
function ai(p,dt){
  const dir=aDir(p.t),ogx=dir>0?0:W,tgx=dir>0?W:0,own=T[p.t],opp=T[1-p.t];
  if(p.i===3){gkAI(p,dt,ogx,dir);return}
  const bd=q=>Math.hypot(q.x-ball.x,q.y-ball.y);const cs=own.filter(q=>q!==me&&q.i!==3);let ch=cs[0];cs.forEach(q=>{if(bd(q)<bd(ch))ch=q});
  if(p.t===0&&bd(me)<bd(ch)-10)ch=null;
  let tx,ty;
  if(p===ch){const gx=tgx-ball.x,gy=H/2-ball.y,gl=Math.hypot(gx,gy)||1;tx=ball.x-gx/gl*22;ty=ball.y-gy/gl*22;
    if((ball.x-p.x)*dir<-6&&Math.abs(ball.y-p.y)<70){tx=p.x;ty=ball.y+(ball.y<H/2?46:-46)}}
  else if(p.i===2){tx=ogx+(ball.x-ogx)*.4;ty=H/2+(ball.y-H/2)*.5}
  else{const hy=p.i===1?H*.3:H*.7;tx=Math.min(W-60,Math.max(60,ball.x+dir*100));ty=hy+(ball.y-hy)*.2}
  const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,s=Math.min(1,d/30);
  move(p,dx/d*s,dy/d*s,3.2,dt);
  if(bd(p)<p.r+ball.r+14&&p.cd<=0&&p.stun<=0){
    const gd=Math.abs(tgx-ball.x),press=opp.some(o=>Math.hypot(o.x-p.x,o.y-p.y)<52),fwd=(ball.x-p.x)*dir>-6;
    if(fwd&&gd<300&&Math.abs(ball.y-H/2)<200&&Math.random()<.2){const gk=opp[3],ty2=(gk.y<H/2?1:-1)*34+H/2+(Math.random()-.5)*14;kick(p,tgx-ball.x,ty2-ball.y,10.5,3)}
    else if((press||Math.random()<.012)&&aiPass(p,dir,press)){}
    else if(press&&Math.random()<.1)kick(p,tgx-ball.x,H/2-ball.y+(Math.random()-.5)*160,8.2,2)}
  if(p.tcd<=0&&p.stun<=0){const car=opp.find(o=>bd(o)<o.r+ball.r+14);
    if(car&&Math.hypot(car.x-p.x,car.y-p.y)<44&&Math.random()<.04)tackle(p,car.x-p.x,car.y-p.y)}
}
function resolveTackles(){T.forEach((tm,t)=>tm.forEach(p=>{if(p.tk<=0||p.hit)return;T[1-t].forEach(o=>{
  if(p.hit||pause>0||Math.hypot(o.x-p.x,o.y-p.y)>p.r+o.r+3)return;
  p.hit=true;p.tk=0;const had=Math.hypot(ball.x-o.x,ball.y-o.y)<o.r+ball.r+16;
  if(!had)return;
  ball.vx=p.fx*5.5+(Math.random()-.5)*2;ball.vy=p.fy*5.5+(Math.random()-.5)*2;ball.vz=2.5;ball.owner=null})}))}
function control(dt){const o=ball.owner;
  if(o.stun>0||o.tk>0||ball.z>14||Math.hypot(ball.x-o.x,ball.y-o.y)>o.r+ball.r+26){ball.owner=null;return}
  if(o.dx===undefined){o.dx=o.fx;o.dy=o.fy}
  const a=1-Math.exp(-8*dt);o.dx+=(o.fx-o.dx)*a;o.dy+=(o.fy-o.dy)*a;
  const l=Math.hypot(o.dx,o.dy)||1,sp=Math.hypot(o.vx,o.vy),off=o.r+ball.r+4+Math.min(1,sp/3)*5,tx=o.x+o.dx/l*off,ty=o.y+o.dy/l*off,b=1-Math.exp(-22*dt);
  ball.vx+=(o.vx+(tx-ball.x)*.22-ball.vx)*b;ball.vy+=(o.vy+(ty-ball.y)*.22-ball.vy)*b}
function press(k){if(state!=='play'||pause>0)return;const atk=isAtk();if(k==='s'&&!atk){switchMe();return}if(k==='a'&&!atk){tackle(me,me.fx,me.fy);return}if(atk){if(k==='d')humanShot(1);else humanPass(k==='a')}}
function release(){}
function humanShot(f){const tg=aDir(0)>0?W:0,gk=T[1][3];let dx=tg-ball.x,dy=(gk.y<H/2?1:-1)*34+H/2-ball.y;const sp=Math.min(.4,Math.max(0,Math.abs(dx)-100)/1400),a=(Math.random()-.5)*2*sp,c=Math.cos(a),n=Math.sin(a);[dx,dy]=[dx*c-dy*n,dx*n+dy*c];kick(me,dx,dy,Math.min(11,4.5+6.5*f),1.5+2.2*f)}
function isAtk(){const o=ball.owner;if(o)return o.t===0;return Math.hypot(ball.x-me.x,ball.y-me.y)<me.r+ball.r+14}
function humanPass(lob,f){const m=1;let best=null,bs=-9;const dmin=lob?120:40,dmax=lob?760:520;T[0].forEach(q=>{if(q===me||q.i===3)return;const dx=q.x-me.x,dy=q.y-me.y,d=Math.hypot(dx,dy);if(d<dmin||d>dmax)return;const c=(dx*me.fx+dy*me.fy)/d;if(c<.55)return;const sc2=c*2-d*.002+(lob?(q.x-me.x)*.002:0);if(sc2>bs){bs=sc2;best=q}});
  const lead=lob?14:8;
  if(best){const d=Math.hypot(best.x-me.x,best.y-me.y),pw=Math.min(lob?9.5:11,(lob?d/40+.3:pass_pw(d))*m);if(kick(me,best.x+best.vx*lead-ball.x,best.y+best.vy*lead-ball.y,pw,lob?8.5:.4))setMe(best)}else kick(me,me.fx,me.fy,(lob?6:6.6)*m,lob?8.5:.4)}
function step(dt){
  if(pause>0){pause-=dt;if(goalBall){netBall(dt);if(pause<=0){goalBall=false;resetPos()}}return}
  let ax=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ay=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  if(joy){ax=joy.x;ay=joy.y}
  const atk=isAtk();
  if(atk!==lastAtk){lastAtk=atk;$('bS').textContent=atk?'패스(S)':'변경(S)';$('bA').textContent=atk?'로빙(A)':'태클(A)'}
  if(chg){if(!atk)chg=null;else chg.t+=dt}
  move(me,ax,ay,3.2,dt);
  
  T.forEach(tm=>tm.forEach(p=>{if(p!==me)ai(p,dt)}));
  resolveTackles();
  const all=T[0].concat(T[1]);
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],b=all[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d<m&&d>0){const o=(m-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o}}
  all.forEach(touch);
  if(ball.owner)control(dt);ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;const f=ball.owner?1:Math.pow(ball.z>1?.82:.5,dt);ball.vx*=f;ball.vy*=f;
  ball.vz-=.4*dt*60;ball.z+=ball.vz*dt*60;if(ball.z<0){ball.z=0;ball.vz=ball.vz<-1.5?-ball.vz*.55:0}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-.8}
  if(ball.y>H-ball.r){ball.y=H-ball.r;ball.vy*=-.8}
  const ig=ball.y>GY0&&ball.y<GY1&&ball.z<50;
  if(ball.x<ball.r&&!ig){ball.x=ball.r;ball.vx*=-.8}
  if(ball.x>W-ball.r&&!ig){ball.x=W-ball.r;ball.vx*=-.8}
  if(ball.x<-ball.r)score(aDir(0)<0?0:1);else if(ball.x>W+ball.r)score(aDir(0)>0?0:1);
  left-=dt;upd();if(left<=0)endHalf();
}
function score(i){sc[i]++;msg=i===0?'GOAL! '+TEAMS[sel[0]].ab:'실점…';$('msg').textContent=msg;upd();nets[ball.x<W/2?0:1].hit={t:0,lx:(GY0+GY1)/2-ball.y,ly:Math.min(40,Math.max(-24,ball.z+ball.r-28))};goalBall=true;pause=1.6}
function endHalf(){if(half===1){state='half';half=2;left=45;upd();$('ovT').textContent='하프타임';$('ovP').innerHTML='전반 종료 '+sc[0]+' : '+sc[1]+'<br>후반에는 진영이 바뀝니다';$('pick').style.display='none';$('start').textContent='후반 시작';$('ov').classList.remove('hide')}else end()}
function end(){state='over';$('pick').style.display='';const a=sc[0],b=sc[1];$('ovT').textContent=a>b?'승리!':a<b?'패배':'무승부';$('ovP').innerHTML='최종 스코어 '+a+' : '+b;$('start').textContent='다시 하기';$('ov').classList.remove('hide')}
// ---------- render ----------
function netBall(dt){ball.x+=ball.vx*dt*60;ball.y=Math.min(GY1-6,Math.max(GY0+6,ball.y+ball.vy*dt*60));const f=Math.pow(.05,dt);ball.vx*=f;ball.vy*=f;
  ball.vz-=.4*dt*60;ball.z+=ball.vz*dt*60;if(ball.z<0){ball.z=0;ball.vz=-ball.vz*.4>.5?-ball.vz*.4:0}
  if(ball.x<-22){ball.x=-22;ball.vx*=-.3}if(ball.x>W+22){ball.x=W+22;ball.vx*=-.3}}
function netUpdate(dt){nets.forEach(n=>{const h=n.hit;if(!h)return;h.t+=dt;const ps=n.m.geometry.attributes.position,end=h.t>2.2,a=end?0:20*Math.exp(-2.4*h.t)*Math.cos(15*h.t);
  for(let i=0;i<ps.count;i++){const d2=(n.bx[i]-h.lx)**2+(n.by[i]-h.ly)**2;ps.setZ(i,n.dir*a*Math.exp(-d2/1100))}ps.needsUpdate=true;if(end)n.hit=null})}
function render(dt){netUpdate(dt);const tt=performance.now()/1000;flags.forEach(f=>{for(let i=0;i<f.p.count;i++)f.p.setZ(i,Math.sin(tt*6-f.bx[i]*.6)*f.bx[i]*.18);f.p.needsUpdate=true});
  if(T)T.forEach(tm=>tm.forEach(p=>{const m=p.m,sp=Math.hypot(p.vx,p.vy);p.ph+=sp*dt*4;const sw=Math.sin(p.ph)*Math.min(1,sp/2)*.9;
    m.position.set(p.x,0,p.y);m.rotation.set(0,Math.atan2(p.fx,p.fy),0);
    m.legs[0].rotation.x=sw;m.legs[1].rotation.x=-sw;m.arms[0].rotation.x=-sw;m.arms[1].rotation.x=sw;
    if(p.tk>0){m.rotation.x=-1.2;m.position.y=7}}));
  if(me){mk.position.set(me.x,82+Math.sin(performance.now()/160)*2.5,me.y);rg.position.set(me.x,.8,me.y)}
  if(ball){bm.position.set(ball.x,ball.r+ball.z,ball.y);bs.position.set(ball.x,.6,ball.y);bs.scale.setScalar(1/(1+ball.z/30));bm.rotation.z-=ball.vx*dt*.9;bm.rotation.x+=ball.vy*dt*.9}
  const cx=W/2+((ball?ball.x:W/2)-W/2)*.2;cam.position.set(cx,520,760);cam.lookAt(cx,0,250);
  rd.render(scene,cam);$('msg').style.display=(pause>0&&msg&&state==='play')?'block':'none'}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='play')step(dt);render(dt);requestAnimationFrame(loop)}
// ---------- input ----------
const nk=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{const k=nk(e);if((k==='s'||k==='a'||k==='d')&&!keys[k])press(k);keys[k]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>{keys[nk(e)]=false;release(nk(e))});
const cvs=rd.domElement,jb=$('jb'),jk=$('jk');
cvs.addEventListener('pointerdown',e=>{const r=wrap.getBoundingClientRect();joy={ox:e.clientX-r.left,oy:e.clientY-r.top,x:0,y:0};jb.style.left=joy.ox+'px';jb.style.top=joy.oy+'px';jb.style.display='block';jk.style.transform='none';cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(!joy)return;const r=wrap.getBoundingClientRect();let dx=(e.clientX-r.left-joy.ox)/40,dy=(e.clientY-r.top-joy.oy)/40;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;jk.style.transform='translate('+dx*30+'px,'+dy*30+'px)'});
['pointerup','pointercancel'].forEach(n=>cvs.addEventListener(n,()=>{joy=null;jb.style.display='none'}));
[['shoot','d'],['bS','s'],['bA','a']].forEach(([id,k])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>release(k)))});
$('start').addEventListener('click',()=>{if(state==='half'){flip=true;resetPos();hintUpd();state='play';pause=.8;msg='';goalBall=false;$('ov').classList.add('hide')}else newGame()});
chips();setup();resetPos();rs();requestAnimationFrame(loop);
</script>
